<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>마스터 클리너: 우리 집을 부탁해!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1f2b27; --night2:#2c3c36; --wall:#ead6c6;
  --wood:#c98a4b; --wood2:#a86d38; --woodd:#6e4524;
  --sofa:#6fa0dc; --mustard:#f2b53f; --olive:#6b8a52; --brick:#b5543f; --panda:#d9622f;
  --lav:#e6dff7; --mint:#d9f0e2; --sky:#dbe9fb; --butter:#fff0c4; --rose:#fddcd7; --white:#fffefb;
  --ink:#2c2a28; --ink2:#5b5650;
  --font-d:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-b:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--font-b);color:var(--ink);background:var(--night);min-height:100dvh;
  background-image:
    radial-gradient(circle at 20% 10%,rgba(255,255,255,.5) 0 1.5px,transparent 2px),
    radial-gradient(circle at 70% 30%,rgba(255,255,255,.4) 0 1.5px,transparent 2px),
    radial-gradient(circle at 40% 80%,rgba(255,255,255,.35) 0 1.5px,transparent 2px);
  background-size:180px 180px,260px 260px,220px 220px;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit}
h1,h2,h3{font-family:var(--font-d);font-weight:400;margin:0}
.app{max-width:1120px;margin:0 auto;padding:12px 12px 40px}
.panel{background:var(--white);border-radius:22px;padding:14px;box-shadow:0 6px 0 rgba(0,0,0,.18)}

/* buttons */
.btn{font-family:var(--font-d);font-size:18px;padding:11px 22px;border:0;border-radius:999px;background:var(--mustard);color:#3a2a10;box-shadow:0 5px 0 #b9831f;cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b9831f}
.btn:focus-visible,.zone:focus-visible,.hbtn:focus-visible,.rc:focus-visible{outline:4px solid #fff;outline-offset:2px}
.btn.alt{background:var(--sky);box-shadow:0 5px 0 #8fb0d9;color:#1d3552}
.btn.alt:active{box-shadow:0 1px 0 #8fb0d9}
.btn.green{background:#9fd8a8;box-shadow:0 5px 0 #5aa56a;color:#143a1c}
.btn.big{font-size:26px;padding:16px 38px}
.btn.sm{font-size:15px;padding:7px 14px;box-shadow:0 3px 0 #b9831f}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* title */
.title{text-align:center;color:#fff;padding:10px 0 30px}
.logo{font-family:var(--font-d);font-size:clamp(44px,10vw,90px);line-height:1;color:var(--mustard);text-shadow:0 5px 0 #8a5a14,0 14px 26px rgba(0,0,0,.45);margin:22px 0 4px}
.logo small{display:block;font-size:.36em;color:#fff;text-shadow:none;margin-top:12px}
.title p.lead{margin:12px auto 22px;max-width:520px;color:#d9e6df;font-size:17px;line-height:1.6}
.title .mas{position:absolute;right:-6px;bottom:-14px;z-index:5}
.herowrap{position:relative;max-width:780px;margin:0 auto}

/* house / map */
.house{max-width:780px;margin:0 auto;position:relative}
.roof{height:92px;margin:0 -2%;background:linear-gradient(#c8604a,#a64b38);clip-path:polygon(50% 0,100% 100%,0 100%);position:relative}
.roof::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.09) 0 2px,transparent 2px 22px);clip-path:polygon(50% 0,100% 100%,0 100%)}
.rooms{display:grid;grid-template-columns:1fr 1fr;border:12px solid #a64b38;border-top:0;background:#a64b38;gap:6px;border-radius:0 0 10px 10px}
.rc{position:relative;display:block;width:100%;min-height:150px;padding:12px 14px;border:0;border-radius:6px;text-align:left;overflow:hidden;font-family:var(--font-d);color:var(--ink);background:var(--rbg)}
.rc0{--rbg:var(--lav)} .rc1{--rbg:var(--mint)} .rc2{--rbg:var(--sky)} .rc3{--rbg:var(--butter)}
button.rc{cursor:pointer;transition:transform .15s}
button.rc:hover:not(:disabled){transform:translateY(-3px)}
.rno{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;font-size:16px}
.rn{display:block;font-size:22px;margin-top:6px}
.rsub{display:block;font-family:var(--font-b);font-size:13px;color:var(--ink2);margin-top:2px}
.rscene{position:absolute;left:14px;bottom:26px;font-size:38px;z-index:2;letter-spacing:4px}
.floor{position:absolute;left:0;right:0;bottom:0;height:34%;background:
  repeating-linear-gradient(60deg,rgba(110,69,36,.35) 0 2px,transparent 2px 16px),
  repeating-linear-gradient(-60deg,rgba(110,69,36,.35) 0 2px,transparent 2px 16px),var(--wood)}
.rst{position:absolute;right:12px;top:10px;color:#e0a000;font-size:22px;letter-spacing:2px;z-index:2}
.rc.locked{filter:grayscale(.85) brightness(.85);cursor:not-allowed}
.lock{position:absolute;right:12px;bottom:10px;font-size:30px;z-index:3}
.mapTop{max-width:780px;margin:0 auto 14px;color:#fff;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.mapTop h2{font-size:26px}
.meter{position:relative;height:26px;min-width:180px;flex:1;max-width:340px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;border:2px solid rgba(255,255,255,.5)}
.mfill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#7bd88f,#f2e36b);border-radius:99px;transition:width .5s}
.mfill::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.25) 0 8px,transparent 8px 16px)}
.meter span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-d);font-size:14px;color:#1d2a24;text-shadow:0 0 4px #fff}
.mapfoot{text-align:center;margin-top:18px}
.link{background:none;border:0;color:#a9c0b6;text-decoration:underline;cursor:pointer;font-size:14px}

/* HUD */
.hud{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;background:var(--night2);border-radius:18px;padding:8px 10px;color:#fff}
.htitle{font-family:var(--font-d);font-size:20px;flex:1 1 140px}
.hchips{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hc{background:rgba(255,255,255,.14);border-radius:99px;padding:4px 11px;font-family:var(--font-d);font-size:15px;white-space:nowrap}
.hbtn{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:99px;padding:5px 12px;font-size:15px;cursor:pointer}
.hbtn:hover{background:rgba(255,255,255,.25)}
.hud .meter{flex:1 1 170px;max-width:260px;min-width:140px;height:24px}
.guide{display:flex;align-items:flex-end;gap:10px;margin:10px 0}
.g-av{flex:none}
.bubble{position:relative;background:#fff;border-radius:18px;padding:10px 14px;font-size:16px;line-height:1.5;max-width:720px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.bubble::before{content:'';position:absolute;left:-9px;bottom:16px;border:9px solid transparent;border-right-color:#fff;border-left:0}

/* classify */
.cls{display:grid;grid-template-columns:230px 1fr;gap:14px;align-items:start}
.carry{position:sticky;top:10px;z-index:20;text-align:center;background:var(--butter)}
.carry-info{font-family:var(--font-d);font-size:15px;display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.carry-info span{font-family:var(--font-b);font-size:13px;color:var(--ink2)}
.curwrap{display:flex;justify-content:center;min-height:132px}
.next{margin-top:8px;font-size:22px;opacity:.55;min-height:30px;letter-spacing:6px}
.tapnote{font-size:12px;color:var(--ink2);margin-top:6px}
.item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 16px;background:#fff;border:3px solid var(--wood);border-radius:20px;box-shadow:0 6px 0 var(--woodd);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;min-width:150px;text-align:center}
.item .em{font-size:54px;line-height:1.05}
.item .nm{font-family:var(--font-d);font-size:18px;color:var(--ink);line-height:1.25}
.item .tg{font-size:12px;background:var(--rose);border-radius:99px;padding:2px 9px}
.item.shake{animation:shake .4s}
.ghost{position:fixed;transform:translate(-50%,-60%) rotate(-4deg) scale(1.08);z-index:3000;pointer-events:none;box-shadow:0 18px 30px rgba(0,0,0,.35)}
.lifted{opacity:.3}
.zone{position:relative;background:var(--zbg,#fff);border:3px dashed rgba(60,45,30,.38);border-radius:16px;padding:8px 10px;cursor:pointer;min-height:72px;transition:transform .15s,background .15s;display:flex;flex-direction:column;gap:2px}
.zone:hover{background:#fff8dc}
.zone.hot{border-style:solid;border-color:var(--mustard);transform:scale(1.03);background:#fff8dc}
.zone.ok{animation:okp .5s}
.zt{font-family:var(--font-d);font-size:15px;line-height:1.25}
.zs{font-size:12px;color:var(--ink2)}
.stash{display:flex;flex-wrap:wrap;gap:2px;margin-top:auto}
.chip{font-size:22px;line-height:1.1;animation:pin .3s}
.zone .big{font-size:34px;line-height:1}

/* wardrobe */
.wardrobe{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px;border:8px solid var(--wood2);border-radius:20px;background:#f1d7b2}
.z-sp,.z-su,.z-wi{--zbg:#fff}
.z-sp{background:#ffe3ea}.z-su{background:#fff3b8}.z-wi{background:#d6e8fb}
.z-hang{grid-column:1/3;grid-row:2/4;--zbg:#fff;min-height:150px}
.z-hat{grid-column:3;grid-row:2;--zbg:#ffe6d6}
.z-fold{grid-column:3;grid-row:3;--zbg:#e9f5e3}
.z-under{grid-column:1/4;grid-row:4;--zbg:#efe6fa}

/* fridge */
.fridge{display:grid;grid-template-columns:1fr 1.5fr 1.1fr;gap:10px;padding:12px;background:#cfe3f1;border:6px solid #9bb9cf;border-radius:22px}
.fcol,.fdoor{display:flex;flex-direction:column;gap:8px}
.fcol .zone,.fdoor .zone{flex:1}
.ffrz .zone{height:100%;--zbg:#e6f4ff}
.fcol .zone,.fdoor .zone{--zbg:#f4fbff}
.pantry{margin-top:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px;background:#f6e3a8;border-radius:22px;border:6px solid #d8bd6a}
.pantry .zone{--zbg:#fffaf0}
.zlabel{font-family:var(--font-d);color:var(--ink2);font-size:14px;margin:12px 4px 4px}

/* order slots */
.slots{display:flex;flex-direction:column;gap:8px}
.slot{flex-direction:row;align-items:center;gap:10px;min-height:64px;--zbg:#fff}
.slot .num{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--sofa);color:#fff;font-family:var(--font-d);font-size:20px}
.slot .stash{flex:1;margin:0}
.slot .chip{display:flex;flex-direction:column;font-size:16px}
.slot .chip small{font-size:12px;color:var(--ink2)}
.slot .hintline{color:#b5ada2;font-size:13px}
.slot:has(.chip) .hintline{display:none}

/* bins */
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.bin{text-align:center;align-items:center;min-height:120px;--zbg:#fff}
.bin.b-paper{background:#e8f0ff}.bin.b-plastic{background:#fff0d9}.bin.b-pet{background:#dff6fb}.bin.b-can{background:#f3e3e3}
.bin.b-glass{background:#e3f6e8}.bin.b-vinyl{background:#f4e8fb}.bin.b-styro{background:#f1f1f1}
.bin.b-food{background:#ffe9d2}.bin.b-gen{background:#e6edf5}.bin.b-spec{background:#e6f6df}.bin.b-med{background:#ffe3ea}.bin.b-bulk{background:#f7ecd2}

/* fold */
.fold{text-align:center}
.fold h3{font-size:24px}
.fold-msg{font-size:17px;line-height:1.5;margin:8px 0}
.foldsvg{width:min(420px,92%);height:auto;display:block;margin:0 auto}
.fl{stroke:#e5484d;stroke-width:3;stroke-dasharray:7 6;fill:none}
.fx{stroke:transparent;stroke-width:36;cursor:pointer}
.fh{font-size:24px;animation:tap 1s infinite;pointer-events:none}
.fr{fill:rgba(229,72,77,.12);stroke:#e5484d;stroke-dasharray:6 5;stroke-width:3;cursor:pointer}
.ft.dn .fl{stroke:#2e9e5b;stroke-dasharray:none}
.ft.dn .fh{display:none}
.fold-steps{display:flex;gap:6px;justify-content:center;margin:8px 0}
.fold-steps i{width:34px;height:8px;border-radius:9px;background:#e3dccf}
.fold-steps i.d{background:#6bbf7e}.fold-steps i.c{background:var(--mustard)}
.garments{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.garment{font-family:var(--font-d);font-size:20px;background:#fff;border:3px solid var(--wood);border-radius:20px;padding:14px 22px;cursor:pointer;box-shadow:0 5px 0 var(--woodd)}
.garment .em{display:block;font-size:48px}
.garment.done{background:#e3f6e8;border-color:#5aa56a;box-shadow:0 5px 0 #3d7a4b}
.garment:active{transform:translateY(4px);box-shadow:none}

/* clean scene */
.clean{display:flex;flex-direction:column;gap:10px}
.phases{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.phases li{font-family:var(--font-d);font-size:13px;text-align:center;background:rgba(255,255,255,.14);color:#cfdcd5;border-radius:12px;padding:6px 2px;line-height:1.3}
.phases li.on{background:var(--mustard);color:#3a2a10}
.phases li.dn{background:#7bbf8a;color:#10301a}
.room{position:relative;width:100%;aspect-ratio:8/5;border:10px solid #a64b38;border-radius:14px;overflow:hidden;background:#ead6c6;user-select:none;-webkit-user-select:none}
.room[data-p="3"],.room[data-p="4"]{touch-action:none;cursor:none}
.rbg{position:absolute;inset:0;width:100%;height:100%}
.rfloor{position:absolute;left:0;right:0;top:49.6%;bottom:0;background:
  repeating-linear-gradient(60deg,rgba(110,69,36,.32) 0 2px,transparent 2px 22px),
  repeating-linear-gradient(-60deg,rgba(110,69,36,.32) 0 2px,transparent 2px 22px),var(--wood)}
.mop{position:absolute;left:0;top:49.6%;width:100%;height:50.4%;pointer-events:none;transition:opacity .8s}
.room[data-p="4"] .mop{pointer-events:auto;touch-action:none}
.mop.gone{opacity:0}
.win{position:absolute;left:33.75%;top:7.2%;width:25%;height:28.8%;border:7px solid #fffaf1;border-radius:60px 60px 4px 4px;overflow:hidden;background:linear-gradient(#cfe9ff,#eef8ff);pointer-events:none;cursor:pointer}
.win .sash{position:absolute;top:0;bottom:0;width:50%;background:rgba(232,242,251,.85);border:3px solid #fffaf1;transition:transform .8s}
.win .sash.l{left:0;transform-origin:left}.win .sash.r{right:0;transform-origin:right}
.win.open .sash.l{transform:perspective(300px) rotateY(-72deg)}
.win.open .sash.r{transform:perspective(300px) rotateY(72deg)}
.win .air{position:absolute;inset:0;display:none;place-items:center;font-size:clamp(18px,4vw,34px)}
.win.open .air{display:grid;animation:drift 2s infinite}
.room[data-p="1"] .win{pointer-events:auto;animation:glow 1s infinite}
.tgt{position:absolute;transform:translate(-50%,-50%);text-align:center;background:rgba(255,255,255,.75);border-radius:12px;padding:1px 6px;font-size:clamp(14px,3.4vw,26px);line-height:1.1;pointer-events:none}
.tgt small{display:block;font-size:clamp(8px,1.5vw,12px);font-family:var(--font-d)}
.mess{position:absolute;transform:translate(-50%,-50%);font-size:clamp(22px,5vw,42px);background:none;border:0;padding:0;cursor:pointer;transition:left .7s,top .7s,opacity .6s,transform .7s;pointer-events:none;z-index:4;line-height:1}
.room[data-p="2"] .mess{pointer-events:auto;animation:wig 1.2s infinite}
.mess.gone{opacity:0;transform:translate(-50%,-50%) scale(.4);animation:none}
.dust{position:absolute;transform:translate(-50%,-50%);width:clamp(18px,4.2vw,36px);height:clamp(12px,2.8vw,24px);border-radius:50%;background:radial-gradient(#8f847b,#cfc6be);opacity:.9;z-index:3;transition:opacity .25s,transform .25s}
.dust.pf{opacity:0;transform:translate(-50%,-50%) scale(1.8)}
.tool{position:absolute;transform:translate(-50%,-80%);font-size:clamp(28px,6vw,52px);pointer-events:none;z-index:9;display:none}
.room[data-p="3"] .tool,.room[data-p="4"] .tool{display:block}
.sofahit{position:absolute;left:62%;top:29%;width:31%;height:27%}
.ctrl{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.ctrl p{margin:0;font-size:17px;line-height:1.5}
.gear{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.gear .btn{font-size:17px}
.gear .btn.on{background:#9fd8a8;box-shadow:0 5px 0 #5aa56a}

/* modal */
.ov{position:fixed;inset:0;background:rgba(15,25,20,.62);display:grid;place-items:center;z-index:1000;padding:14px;animation:fade .2s}
.mdl{background:var(--white);border-radius:26px;max-width:520px;width:100%;padding:18px 20px 20px;box-shadow:0 12px 0 rgba(0,0,0,.25);max-height:92dvh;overflow:auto}
.mdl-top{display:flex;align-items:center;gap:10px}
.mdl-top h3{font-size:23px;line-height:1.3}
.mdl-body{font-size:17px;line-height:1.6;margin:8px 0 14px}
.mdl-body p{margin:6px 0}
.mdl-body .big{font-size:22px}
.mdl-body .why{background:var(--butter);border-radius:14px;padding:9px 12px;font-size:16px}
.mdl-btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.mdl-btns .choice{flex:1 1 100%;text-align:left;font-size:17px;border-radius:18px}

/* pop */
.pop{position:fixed;left:50%;top:120px;transform:translateX(-50%);font-family:var(--font-d);font-size:26px;color:#fff;background:#3f8f5a;border-radius:99px;padding:4px 16px;z-index:1500;pointer-events:none;animation:floatup 1s forwards;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:2000}

/* result */
.result{max-width:560px;margin:20px auto;text-align:center;background:var(--white)}
.result h2{font-size:32px;margin:6px 0}
.stars{font-size:64px;letter-spacing:6px;line-height:1.1}
.star{color:#d8d2c6;display:inline-block}
.star.on{color:#f2b53f;text-shadow:0 3px 0 #b9831f;animation:starin .6s both;animation-delay:var(--d)}
.r-msg{font-size:18px;line-height:1.6;margin:8px 0 14px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.stats div{background:var(--butter);border-radius:14px;padding:8px;font-size:14px;color:var(--ink2)}
.stats b{display:block;font-family:var(--font-d);font-size:22px;color:var(--ink);font-weight:400}
.rbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* certificate */
.cert-wrap{max-width:760px;margin:10px auto;text-align:center}
.cert{background:#fffdf6;border:14px double #c98a4b;border-radius:10px;padding:26px 24px 22px;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.2);position:relative}
.cert h1{font-size:clamp(30px,6vw,46px);color:var(--brick)}
.cert .cname{font-family:var(--font-d);font-size:clamp(28px,6vw,42px);border-bottom:3px solid var(--ink);display:inline-block;min-width:220px;margin:12px 0;padding:0 14px}
.cert p{line-height:1.75;font-size:17px;margin:6px auto;max-width:560px}
.cert .rank{font-family:var(--font-d);font-size:30px;color:var(--olive)}
.cert .cs{font-size:34px;color:#e0a000;letter-spacing:4px}
.cert .sign{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px;font-size:15px;text-align:left}
.cert-ui{margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}
.cert-ui input{font-family:var(--font-b);font-size:18px;padding:10px 16px;border-radius:99px;border:3px solid var(--mustard);width:200px;text-align:center}

/* animations */
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes okp{0%{transform:scale(1)}40%{transform:scale(1.06);background:#d9f5df}100%{transform:scale(1)}}
@keyframes pin{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes tap{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes floatup{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-60px}}
@keyframes fade{from{opacity:0}to{opacity:1}}

.o.hs.big{display:grid;place-items:center;font-size:clamp(34px,7vw,64px)}

.o.win .sash{position:absolute;top:0;bottom:0;width:50%;background:rgba(232,242,251,.85);border:3px solid #fffaf1;transition:transform .8s}

.toolcards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.toolc{text-align:center;background:#fff;border:3px solid var(--wood);border-radius:18px;padding:12px 8px;font-family:var(--font-d);font-size:17px}

.prep{max-width:520px;margin:20px auto;text-align:center}

@media (max-width:760px){
  .dz{grid-template-columns:1fr}
  .steps div{font-size:11px}

.vbar{position:relative;width:min(420px,100%);height:34px;background:#e9e2d4;border-radius:99px;overflow:hidden}

.drops{font-size:30px;min-height:36px}

.hands{display:flex;align-items:center;gap:16px}
.hb{width:110px;height:110px;border-radius:50%;border:4px solid var(--wood);background:#fff;font-size:44px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none}

<script>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const SAVE_KEY='masterCleaner.v2';
const G={stars:0,best:0,name:'',sound:true};

let AC=null,audioUnlocked=false,silentEl=null;
function getAC(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}return AC}
/* 아이폰/아이패드: 터치 안에서 오디오를 깨워야 소리가 나요 (무음 스위치 대응 포함) */
function unlockAudio(){
  try{
    const ac=getAC();
    if(ac){if(ac.state!=='running')ac.resume();
      if(!audioUnlocked){const bf=ac.createBuffer(1,1,22050),sr=ac.createBufferSource();sr.buffer=bf;sr.connect(ac.destination);sr.start(0)}}
    if(!silentEl){silentEl=document.createElement('audio');silentEl.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';silentEl.loop=true;silentEl.setAttribute('playsinline','');silentEl.preload='auto'}
    const pr=silentEl.play();if(pr&&pr.catch)pr.catch(()=>{});
    audioUnlocked=true;
  }catch(e){}
}
['pointerdown','touchstart','touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{passive:true}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&AC&&AC.state!=='running')AC.resume()});
function beep(f,d=.12,type='sine',v=.09,delay=0){
  if(!G.sound)return;
  try{
    const ac=getAC();if(!ac)return;if(ac.state!=='running')ac.resume();
    const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
    o.connect(g);g.connect(ac.destination);const t=ac.currentTime+delay;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d+.02);
  }catch(e){}
}
const sfx={
  ok:()=>{beep(660,.12);beep(880,.16,'sine',.07,.09)},
  no:()=>beep(170,.28,'sawtooth',.05),
  tap:()=>beep(520,.06,'triangle',.05),
  fan:()=>[523,659,784,1047,784,1047].forEach((f,i)=>beep(f,.2,'triangle',.07,i*.13))
};

const FALL={happy:['happy'],sad:['sad'],go:['go','happy'],shock:['shock','sad'],tired:['tired','sad'],clean:['clean','happy'],shy:['shy','sad'],talk:['talk','happy'],base:['base','happy']};
function charImg(role,feel,sz=64){
  for(const f of (FALL[feel]||['happy'])){
    const a=IMGS[role]&&IMGS[role][f];
    if(a){const k=a[Math.random()*a.length|0];return `<img class="mimg ${feel==='sad'?'oops':''}" src="${CH[k]}" alt="${nameOf(role)}" width="${sz}" height="${sz}">`}
  }
  return '';
}
const PLACEROLE={bins:'bins',pharm:'pharm',office:'office'};
const MOODMAP={happy:'happy',cheer:'happy',joy:'happy',oops:'sad',cry:'sad',shock:'shock',tired:'tired',shy:'shy',clean:'clean',run:'go',ready:'go'};
function panda(sz=64,mood='happy',noPlace){
  if(mood==='hw')return charImg('bins','happy',sz);
  if(mood==='sh')return charImg('pharm','happy',sz);
  if(mood==='ku')return charImg('office','happy',sz);
  const loc=(typeof S!=='undefined'&&S)?S.loc:null;
  if(!noPlace&&loc&&PLACEROLE[loc]&&(mood==='oops'||mood==='happy'||mood==='cheer'))return charImg(PLACEROLE[loc],mood==='oops'?'sad':'happy',sz);
  return charImg('hero',MOODMAP[mood]||'happy',sz);
}

function hint(){
  if(S.hints>=3)return toast('힌트를 모두 썼어요!');
  S.hints++;S.score=Math.max(0,S.score-50);
  const dir=r=>r===S.rm?'지금 이 방':(r<S.rm?`◀ 왼쪽 (${ROOMS[r].n})`:`▶ 오른쪽 (${ROOMS[r].n})`);
  let msg='';S.hintId=null;
  if(S.pocket.length){const it=S.pocket[0],c=CONT[it.dest.c];
    if(c.out){if(S.loc===it.dest.c){msg=`${it.e} ${it.n}은(는) 지금 이곳의 '${c.n}'에 넣어요!`;const h=W.find(o=>o.cid===it.dest.c&&o.rm===S.loc);if(h)S.hintId=h.id}else if(S.loc)msg=`${it.e} ${it.n}은(는) '${c.n}'에 가져가는 물건이에요. 집 앞 거리에서 그곳으로 가요.`;else msg=`${it.e} ${it.n}은(는) 집 밖 '${c.n}'에 가져가야 해요. ${dir(4)}의 현관문으로 나가요.`}
    else{msg=`${it.e} ${it.n}은(는) ${dir(c.rm)}의 '${c.n}'에 넣는 물건이에요.`;if(!S.loc&&c.rm===S.rm){const h=W.find(o=>o.cid===it.dest.c&&o.rm===S.rm);if(h)S.hintId=h.id}}}
  else if(S.loc)msg='집으로 돌아가서 남은 일을 이어 가요!';
  else{
    const left=items().filter(o=>(o.st==='world'||o.st==='in')).sort((a,b)=>Math.abs(a.rm-S.rm)-Math.abs(b.rm-S.rm));
    if(left.length){const it=left[0];
      if(it.st==='in')msg=`${dir(3)}의 냉장고 속을 확인해 봐요. 엉뚱한 물건이 들어 있어요!`;
      else if(it.hidden)msg=`${dir(it.rm)}에 숨겨진 물건이 있어요. 침대 밑이나 소파 쿠션을 살펴봐요.`;
      else{msg=`${dir(it.rm)}에 아직 주울 물건이 남아 있어요.`;if(it.rm===S.rm)S.hintId=it.id}}
    else if(!chairsHome())msg='의자를 끌어서 점선 자리로 옮겨야 해요 (주방, 내 방).';
    else if(S.win.some(w=>!w))msg=`${dir(S.win.findIndex(w=>!w))}의 창문을 열어 환기해요.`;
    else if(W.some(o=>o.k==='dust'&&!o.done)){const o=W.find(o=>o.k==='dust'&&!o.done);msg=`${dir(o.rm)}에 먼지가 남았어요. 청소기가 필요해요(다용도실 용구함).`}
    else if(W.some(o=>o.k==='stain'&&!o.done)){const o=W.find(o=>o.k==='stain'&&!o.done);msg=`${dir(o.rm)}에 얼룩이 남았어요. ${o.leather?'가죽 소파는 마른걸레로!':'젖은 걸레가 필요해요.'}`}
    else if(!S.mopWashed)msg='다용도실에서 젖은 걸레를 빨아 건조대에 널어요.';
    else msg='들고 있는 용구를 용구함에 제자리로 넣어요.';
  }
  toast('💡 '+msg,'ready');render();
}

    if(o&&sc.contains(o)){e.stopPropagation();openMenu(o);return}
    if(!e.target.closest('.menu'))closeMenu();
  };
  /* 가구 끌어서 옮기기 + 화면 스와이프로 방 이동 */
  const sceneXY=e=>{const sc=$('#scene'),r=sc.getBoundingClientRect();return{x:(e.clientX-r.left-sc.clientLeft)*800/(sc.clientWidth||r.width),y:(e.clientY-r.top-sc.clientTop)*500/(sc.clientHeight||r.height)}};
  let cd=null,sw=null,lastDrag=0;
  app.addEventListener('pointerdown',e=>{
    if(!S||$('.ov')||$('.ovp'))return;
    const c=e.target.closest('.o.ch');
    if(c){const o=byId[c.dataset.o];
      if(o.home){toast('의자는 이미 제자리에 놓았어요! ✔');return}
      if(items().some(i=>i.onChair===o.id&&i.st==='world')){toast('의자 위에 물건이 걸려 있어요. 먼저 주워요!');return}
      closeMenu();cd={o,el:c,id:e.pointerId,sx:e.clientX,sy:e.clientY,moved:false};try{c.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault();return}
    if(!e.target.closest('.o')&&!e.target.closest('.menu')&&e.target.closest('#scene')&&!e.target.closest('.arr'))sw={x:e.clientX,y:e.clientY,t:performance.now()};
  });
  app.addEventListener('pointermove',e=>{
    if(!cd||e.pointerId!==cd.id)return;
    if(!cd.moved&&Math.hypot(e.clientX-cd.sx,e.clientY-cd.sy)>7){cd.moved=true;cd.el.classList.add('drag')}
    if(cd.moved){const p=sceneXY(e);cd.o.x=Math.max(30,Math.min(770,p.x));cd.o.y=Math.max(270,Math.min(450,p.y));cd.el.style.left=cd.o.x/8+'%';cd.el.style.top=cd.o.y/5+'%'}
  });
  const endDrag=e=>{
    if(sw&&!cd){const dx=e.clientX-sw.x,dy=e.clientY-sw.y,v=Math.abs(dx)/Math.max(1,performance.now()-sw.t);if(Math.abs(dx)>90&&Math.abs(dy)<70&&v>.25){lastDrag=Date.now();go(dx<0?1:-1)}sw=null}
    if(!cd||e.pointerId!==cd.id)return;
    const d=cd;cd=null;d.el.classList.remove('drag');
    if(!d.moved)return;lastDrag=Date.now();
    const o=d.o,home=Math.hypot(o.x-o.hx,o.y-o.hy)<75;
    if(home){o.x=o.hx;o.y=o.hy;if(!o.home){o.home=true;o.msg='의자는 제자리에 잘 놓았어요! ✔';good(80);say('의자를 제자리에 쏙! 이제 길이 뚫렸어요.')}}
    else{o.home=false;toast('의자를 점선 자리까지 끌어다 놓아요!')}
    render();checkWin();
  };
  app.addEventListener('pointerup',endDrag);app.addEventListener('pointercancel',endDrag);
  const oc=app.onclick;app.onclick=e=>{if(Date.now()-lastDrag<250)return;oc(e)};
  render();
  modal({title:'우리 집이 난장판이에요! 😱',html:'<p>욕실에서 대파를 발견하는 수준이라니…</p><p class="why">물건·가구를 눌러 <b>줍기·열기</b>를 하고, <b>의자는 끌어서</b> 점선 자리로 옮겨요. 화면을 옆으로 쓸어 넘겨도 방이 바뀌어요. 청소 단계마다 손으로 하는 미니게임이 나와요! 막히면 💡힌트 (3번).</p>',buttons:[{t:'좋아요, 시작!'}]});

}
function finish(){
  clearInterval(S.timer);S.timer=null;S.sec=Math.floor((Date.now()-S.t0)/1000);
  const acc=S.ok/Math.max(1,S.ok+S.bad),stars=acc>=.85&&S.hints<=1?3:acc>=.7?2:1;
  const bonus=Math.max(0,3000-S.sec*2);S.score+=bonus;

  const msg=stars===3?'완벽해요! 집이 반짝반짝, 교과서 내용을 정확하게 알고 있네요.':stars===2?'잘했어요! 헷갈린 부분만 다시 보면 별 3개도 문제없어요.':'끝까지 해냈어요! 다시 도전하면 더 높은 별을 받을 수 있어요.';

  <div class="stats"><div>걸린 시간<b>${fmt(S.sec)}</b></div><div>정확도<b>${Math.round(acc*100)}%</b></div><div>최고 콤보<b>${S.maxCombo}</b></div><div>점수(속도 보너스 +${bonus})<b>${S.score}</b></div></div>

}
